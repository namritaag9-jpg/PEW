<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password · Patel Workshop POS</title><link rel="stylesheet" href="{{url_for('static',filename='css/app.css')}}"></head>
<body class="loginbg"><form class="loginbox" method="post"><div class="brand big">PE<span>W</span><small>WORKSHOP POS</small></div><h2>Change your password</h2><p class="muted">For security, set a new password before continuing.</p>
{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="toast {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
<input name="current_password" type="password" placeholder="Current password" required autofocus><input name="new_password" type="password" placeholder="New password (8+ characters)" minlength="8" required><input name="confirm_password" type="password" placeholder="Confirm new password" minlength="8" required><button class="primary">Update password</button><p class="hint">Use a password you do not share with others.</p></form></body></html>
