{% extends 'base.html' %}{% block title %}Mobile Barcode Scanner{% endblock %}
{% block content %}
<div class="card mobile-panel"><h2>Scan Barcode / Find Motor</h2><p class="muted">Use the phone camera to scan the serial barcode. The barcode contains the serial only.</p>
<div class="form-grid"><input id="code" placeholder="Scan barcode or enter serial" autofocus><button onclick="findJob()">Find Job</button></div>
<div class="scanner-actions">
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden onchange="scanCameraImage(this.files[0])">
  <button type="button" onclick="document.getElementById('cameraInput').click()">📷 Open Camera / Scan</button>
  <button type="button" id="liveButton" onclick="startLiveScanner()">🎥 Live Scanner (HTTPS only)</button>
</div>
<div id="httpNotice" class="muted" style="margin-top:8px"></div>
<div id="capturePreview" style="display:none;margin-top:12px"></div>
<div id="reader" style="display:none;width:100%;max-width:520px;margin-top:12px"></div>
<div id="scanStatus" class="muted" style="margin-top:8px"></div>
<div id="result"></div></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let liveScanner=null;
const resultEl=()=>document.getElementById('result');
const statusEl=()=>document.getElementById('scanStatus');
const esc=(value)=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function readJson(response){const text=await response.text();try{return text?JSON.parse(text):{};}catch{return {error:text||`Request failed (${response.status})`};}}
function setCodeAndFind(value){const clean=String(value||'').trim();if(!clean)return false;document.getElementById('code').value=clean;findJob();return true;}
async function findJob(){const q=document.getElementById('code').value.trim();if(!q){resultEl().innerHTML='<p>Please enter or scan a serial number.</p>';return;}try{const r=await fetch('/api/mobile/job?q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});const d=await readJson(r);if(!r.ok){resultEl().innerHTML='<p>'+esc(d.error||'Lookup failed')+'</p>';return;}render(d);}catch(err){resultEl().innerHTML='<p>Unable to connect to the POS server. Check Wi-Fi and try again.</p>';}}
function render(j){if(j.unallocated){resultEl().innerHTML=`<h3>Serial: ${esc(j.serial)}</h3><p class="muted">Preprinted serial found. Enter details to allocate it.</p><form onsubmit="allocate(event)" class="mobile-form"><input type="hidden" name="serial" value="${esc(j.serial)}"><label>Customer</label><input name="customer_name" required autocomplete="name"><label>Phone</label><input name="phone" inputmode="tel" autocomplete="tel"><label>Appliance</label><input name="appliance" value="Motor" required><label>Brand</label><input name="brand"><label>Complaint</label><textarea name="complaint"></textarea><label>Technician</label><select name="technician"><option>Harishankar Patel</option><option>Others</option></select><button type="submit">Allocate Serial &amp; Save</button></form>`;return;}resultEl().innerHTML=`<h3>${esc(j.serial)} · ${esc(j.job_no)}</h3><p>Status: <b>${esc(j.status||'')}</b></p><p class="muted">Last scanned: ${esc(j.last_scanned_at||'Not yet')} · Total scans: ${esc(j.scan_count||0)}</p><form onsubmit="save(event,${Number(j.id)})" class="mobile-form"><label>Customer</label><input name="customer_name" value="${esc(j.customer||'')}"><label>Phone</label><input name="phone" value="${esc(j.phone||'')}" inputmode="tel"><label>Address</label><input name="address" value="${esc(j.address||'')}"><label>Appliance</label><input name="appliance" value="${esc(j.appliance||'')}"><label>Complaint</label><textarea name="complaint">${esc(j.complaint||'')}</textarea><label>Status</label><select name="status">{% for s in STATUSES %}<option value="{{s}}">{{s}}</option>{% endfor %}</select><button type="submit">Save to Dashboard</button></form><div id="scanHistory"></div>`;loadHistory(j.id);}
async function allocate(e){e.preventDefault();const form=e.currentTarget;const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='Creating Job…';const o=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/mobile/allocate',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(o)});const d=await readJson(r);if(!r.ok){resultEl().innerHTML='<p>'+esc(d.error||'Allocation failed')+'</p>';return;}resultEl().innerHTML=`<div class="success"><h3>Job created successfully</h3><p>Serial: <b>${esc(d.serial)}</b></p><p>Job No: <b>${esc(d.job_no)}</b></p><p>Status: <b>Received</b></p><p><a class="btn" href="/jobs/${Number(d.job_id)}">Open Job Card</a></p><button type="button" onclick="setCodeAndFind('${esc(d.serial)}')">Open in Scanner</button></div>`;}catch(err){resultEl().innerHTML='<p>Unable to connect while creating the job.</p>';}finally{button.disabled=false;button.textContent='Allocate Serial & Save';}}
async function loadHistory(id){try{const r=await fetch('/api/mobile/job/'+Number(id)+'/scan-history');const rows=await readJson(r);const el=document.getElementById('scanHistory');if(el)el.innerHTML=Array.isArray(rows)&&rows.length?'<h4>Scan history</h4>'+rows.map(x=>'<p class="muted">'+esc(x.scanned_at)+' · '+esc(x.scanned_by||'unknown')+'</p>').join(''):'<p class="muted">No scan history</p>';}catch{}}
async function save(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e.currentTarget));try{const r=await fetch('/api/mobile/job/'+Number(id),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(o)});const d=await readJson(r);alert(r.ok?'Saved to shared POS database':(d.error||'Save failed'));}catch{alert('Unable to connect to the POS server.');}}
async function scanCameraImage(file){if(!file)return;const preview=document.getElementById('capturePreview');preview.style.display='block';preview.innerHTML='<p class="muted">Captured image:</p><img src="'+URL.createObjectURL(file)+'" alt="Captured barcode" style="max-width:100%;max-height:260px;border-radius:10px"><br><button type="button" onclick="document.getElementById(\'cameraInput\').click()">Retake photo</button>';statusEl().textContent='Reading barcode from camera image…';resultEl().innerHTML='';try{if(window.Html5Qrcode){const helper=new Html5Qrcode('reader');try{const decoded=await helper.scanFile(file,true);setCodeAndFind(decoded);statusEl().textContent='Barcode read successfully.';return;}catch(e){}}const form=new FormData();form.append('image',file,file.name||'camera.jpg');const r=await fetch('/api/mobile/scan-barcode',{method:'POST',body:form,headers:{'Accept':'application/json'}});const d=await readJson(r);if(!r.ok){statusEl().textContent=d.error||'Barcode could not be decoded. Retake with the full barcode visible.';return;}setCodeAndFind(d.serial);statusEl().textContent='Barcode read successfully.';}catch(e){statusEl().textContent='Could not read the barcode image. Move closer, improve lighting, and try again.';}}
async function startLiveScanner(){if(!window.Html5Qrcode){alert('Scanner library could not be loaded. Use the camera button instead.');return;}if(!window.isSecureContext){statusEl().textContent='This HTTP LAN page cannot show a live camera feed because mobile browsers require HTTPS for camera access. Use “Open Camera / Scan”; it works on HTTP and lets you retake the photo.';document.getElementById('cameraInput').click();return;}const box=document.getElementById('reader');box.style.display='block';statusEl().textContent='Requesting camera permission…';try{liveScanner=new Html5Qrcode('reader');await liveScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:120},formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.QR_CODE]},decoded=>{stopLiveScanner();setCodeAndFind(decoded);statusEl().textContent='Barcode read successfully.'},()=>{});statusEl().textContent='Camera active. Point it at the barcode.';}catch(e){box.style.display='none';statusEl().textContent='Live camera permission/availability failed. Use “Open Camera / Scan” instead.';}}
async function stopLiveScanner(){if(liveScanner){try{await liveScanner.stop();}catch{}try{liveScanner.clear();}catch{}liveScanner=null;}document.getElementById('reader').style.display='none';}
document.addEventListener('DOMContentLoaded',()=>{const notice=document.getElementById('httpNotice');if(notice&&!window.isSecureContext){notice.textContent='HTTP LAN mode: use Open Camera / Scan. Live preview requires HTTPS and cannot be enabled by Flask alone.';}});
</script>{% endblock %}
