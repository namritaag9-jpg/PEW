{% extends "base.html" %}{% block title %}Customers{% endblock %}{% block content %}
<div class="twocol"><section class="card"><div class="cardhead"><h3>Add customer</h3></div><form method="post" class="form"><input name="name" placeholder="Customer name" required><input name="phone" placeholder="Phone"><input name="address" placeholder="Address"><input name="email" placeholder="Email"><button class="primary">Save customer</button></form></section>
<section class="card"><div class="cardhead"><h3>Customer directory</h3><form><input name="q" value="{{q}}" placeholder="Search name / phone"></form></div><div class="tablewrap"><table><tr><th>Name</th><th>Phone</th><th>Address</th></tr>{% for x in customers %}<tr><td>{{x.name}}</td><td>{{x.phone or '—'}}</td><td>{{x.address or '—'}}</td></tr>{% else %}<tr><td colspan="3" class="empty">No customers.</td></tr>{% endfor %}</table></div></section></div>{% endblock %}
