{% extends "base.html" %}{% block title %}Expenses{% endblock %}{% block content %}
<div class="twocol"><section class="card"><div class="cardhead"><h3>Record expense</h3></div><form method="post" class="form"><input name="title" placeholder="Expense title" required><input name="amount" type="number" step=".01" placeholder="Amount" required><input name="category" placeholder="Category"><input name="spent_at" placeholder="YYYY-MM-DD HH:MM:SS"><textarea name="note" placeholder="Note"></textarea><button class="primary">Save Expense</button></form></section><section class="card"><div class="cardhead"><h3>Expense register</h3></div><div class="tablewrap"><table><tr><th>Date</th><th>Title</th><th>Category</th><th>Amount</th></tr>{% for x in expenses %}<tr><td>{{x.spent_at}}</td><td>{{x.title}}</td><td>{{x.category}}</td><td>₹{{'%.2f'|format(x.amount)}}</td></tr>{% endfor %}</table></div></section></div>{% endblock %}
